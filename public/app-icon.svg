<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Исходник иконки Glafira for LLM Inference: чип ускорителя (инференс идёт на GPU) и линия пульса на графите. Набор для платформ: pnpm tauri icon public/app-icon.svg -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55606f"/>
      <stop offset="1" stop-color="#1c222c"/>
    </linearGradient>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="874" y2="0">
      <stop offset="0" stop-color="#e3e8ef"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3dae4"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Выводы: по пять сверху и снизу, по четыре слева и справа — средние там занял бы пульс -->
  <path d="M352 292 V220 M432 292 V220 M512 292 V220 M592 292 V220 M672 292 V220 M352 732 V804 M432 732 V804 M512 732 V804 M592 732 V804 M672 732 V804 M292 352 H220 M292 432 H220 M292 592 H220 M292 672 H220 M732 352 H804 M732 432 H804 M732 592 H804 M732 672 H804" stroke="url(#body)" stroke-width="36" stroke-linecap="round"/>
  <!-- Корпус, кристалл и метка первого вывода -->
  <rect x="292" y="292" width="440" height="440" rx="48" fill="url(#body)"/>
  <rect x="372" y="372" width="280" height="280" rx="24" fill="none" stroke="#3b4554" stroke-width="16"/>
  <circle cx="336" cy="336" r="14" fill="#3b4554"/>
  <!-- Пульс: тёмная подложка, чтобы линия читалась и на белом, и на графите -->
  <path d="M180 512 H372 L424 404 L488 632 L552 352 L612 568 L652 512 H844" fill="none" stroke="#12161d" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M180 512 H372 L424 404 L488 632 L552 352 L612 568 L652 512 H844" fill="none" stroke="#ffb020" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
